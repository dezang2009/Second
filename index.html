<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dde4f6" />
    <title>Rhythm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-screen="menu">
    <canvas id="game"></canvas>

    <main class="ui">
      <!-- 메뉴 -->
      <section id="screen-menu" class="screen menu-screen">
        <div class="title-block">
          <p class="kicker">4 LANES RHYTHM</p>
          <h1 class="game-title">Rhythm</h1>
          <p class="title-sub">좋아하는 곡으로 즐기는 4키 리듬게임</p>
        </div>
        <nav class="menu-list" aria-label="메뉴">
          <button id="menu-play" class="menu-card primary" type="button">
            <span class="menu-card-title">게임 시작</span>
            <span class="menu-card-sub">곡을 골라 플레이해요</span>
          </button>
          <button id="menu-edit" class="menu-card" type="button">
            <span class="menu-card-title">채보 만들기</span>
            <span class="menu-card-sub">곡을 들으며 노트를 찍어요</span>
          </button>
          <button id="menu-metronome" class="menu-card" type="button">
            <span class="menu-card-title">메트로놈 연습</span>
            <span class="menu-card-sub">박자에 손을 풀어요</span>
          </button>
          <button id="menu-settings" class="menu-card" type="button">
            <span class="menu-card-title">설정</span>
            <span class="menu-card-sub">싱크, 노트 속도, 소리를 맞춰요</span>
          </button>
        </nav>
        <p class="menu-foot">음원과 기록은 이 기기에만 저장돼요</p>
      </section>

      <!-- 곡 선택 -->
      <section id="screen-list" class="screen select-screen" hidden>
        <header class="select-head">
          <button id="list-back" class="back" type="button">‹ 메뉴</button>
          <h1 id="list-heading">곡 선택</h1>
          <span id="list-count" class="list-count"></span>
        </header>
        <div id="hero" class="hero" hidden></div>
        <div class="list-tools">
          <input id="song-search" class="search" type="search" placeholder="곡 이름, 가수 검색" aria-label="곡 이름, 가수 검색" autocomplete="off" />
          <div class="tool-row">
            <select id="song-sort" aria-label="정렬">
              <option value="recent">최근 플레이 순</option>
              <option value="added">추가한 순</option>
              <option value="name">이름 순</option>
              <option value="score">최고 점수 순</option>
            </select>
            <button id="fav-only" class="chip-toggle" type="button" aria-pressed="false">★ 즐겨찾기</button>
            <label class="chip-toggle add-chip" for="file">+ 음원 추가</label>
          </div>
        </div>
        <ul id="song-list" class="song-rows"></ul>
        <input id="file" type="file" accept="audio/*" hidden />
        <input id="import-file" type="file" accept=".json,application/json" hidden />
        <p id="list-status" class="status" role="status"></p>
      </section>

      <!-- 설정 -->
      <section id="screen-settings" class="screen list-screen settings-screen" hidden>
        <header class="list-head">
          <button id="settings-back" class="back" type="button">‹ 메뉴</button>
          <h1>설정</h1>
          <p>이 기기에만 저장돼요</p>
        </header>
        <div class="settings-body"></div>
        <p id="settings-status" class="status" role="status"></p>
      </section>

      <!-- 플레이 -->
      <section id="screen-play" class="screen play-screen" hidden>
        <header class="hud">
          <div class="hud-row">
            <span id="play-title" class="hud-title"></span>
            <span id="play-meta"></span>
          </div>
          <div class="hud-row">
            <span id="play-clock" class="num">0:00.00</span>
            <div id="play-beats" class="beats" aria-hidden="true"></div>
            <span id="play-bar" class="num">마디 -</span>
          </div>
          <div class="hud-row">
            <span id="play-score" class="score num">0000000</span>
            <button id="play-pause" class="btn ghost small" type="button">일시정지</button>
          </div>
        </header>
        <div id="pause-menu" class="pause-card" hidden>
          <p class="pause-title">일시정지</p>
          <button id="resume" class="btn" type="button">계속하기</button>
          <button id="restart" class="btn ghost" type="button">처음부터</button>
          <button id="quit" class="btn ghost" type="button">나가기</button>
        </div>
      </section>

      <!-- 결과 -->
      <section id="screen-result" class="screen result-screen" hidden>
        <div class="result-card">
          <p id="result-title" class="result-title"></p>
          <div class="rank-row">
            <span id="result-rank" class="rank">S</span>
            <div class="rank-side">
              <span id="result-score" class="result-score num">0</span>
              <span class="badge-row"><span id="result-best" class="badge" hidden>새 최고 기록</span><span id="result-fc" class="badge fc" hidden></span></span>
              <span id="result-prev" class="prev num"></span>
            </div>
          </div>
          <dl class="result-grid">
            <div><dt>PERFECT</dt><dd id="r-perfect" class="num">0</dd></div>
            <div><dt>GREAT</dt><dd id="r-great" class="num">0</dd></div>
            <div><dt>GOOD</dt><dd id="r-good" class="num">0</dd></div>
            <div><dt>MISS</dt><dd id="r-miss" class="num">0</dd></div>
            <div><dt>최대 콤보</dt><dd id="r-combo" class="num">0</dd></div>
            <div><dt>정확도</dt><dd id="r-acc" class="num">0%</dd></div>
          </dl>
          <p id="result-timing" class="timing"></p>
          <p id="result-fastslow" class="timing fastslow num"></p>
          <button id="apply-sync" class="btn ghost small apply-sync" type="button" hidden></button>
          <div id="result-trouble" class="trouble" hidden>
            <span id="trouble-text"></span>
            <button id="practice" class="btn ghost small" type="button">이 구간 연습하기</button>
          </div>
          <div class="result-actions">
            <button id="again" class="btn" type="button">다시 하기</button>
            <button id="result-back" class="btn ghost" type="button">목록으로</button>
          </div>
        </div>
      </section>

      <!-- 채보 만들기 -->
      <section id="screen-edit" class="screen edit-screen" hidden>
        <header class="hud">
          <div class="hud-row">
            <span id="edit-title" class="hud-title"></span>
            <span id="edit-count"></span>
          </div>
          <div class="hud-row">
            <span id="edit-clock" class="num">0:00.00</span>
            <span id="edit-mode" class="mode-label"></span>
            <button id="edit-stop" class="btn ghost small" type="button">멈춤</button>
          </div>
          <p id="edit-status" class="status edit-status" role="status"></p>
        </header>
        <div id="edit-panel" class="edit-panel">
          <div class="edit-row seek-row">
            <button id="edit-back" class="btn ghost small" type="button">-2초</button>
            <input id="edit-seek" class="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="편집 위치" />
            <button id="edit-fwd" class="btn ghost small" type="button">+2초</button>
          </div>
          <div class="edit-row">
            <button id="edit-record" class="btn small" type="button">● 녹음</button>
            <button id="edit-preview" class="btn ghost small" type="button">▶ 듣기</button>
            <button id="edit-undo" class="btn ghost small" type="button">되돌리기</button>
            <button id="edit-save" class="btn small" type="button">저장</button>
          </div>
          <div class="edit-row">
            <label class="snap">박 맞추기
              <select id="edit-snap">
                <option value="0">끄기</option>
                <option value="1">1박</option>
                <option value="2">1/2박</option>
                <option value="4">1/4박</option>
              </select>
            </label>
            <button id="edit-test" class="btn ghost small" type="button">시험 플레이</button>
            <button id="edit-clear" class="btn ghost small" type="button">전체 지우기</button>
            <button id="edit-exit" class="btn ghost small" type="button">나가기</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
