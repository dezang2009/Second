<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#171922" />
    <title>Rhythm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-screen="list">
    <canvas id="game"></canvas>

    <main class="ui">
      <!-- 곡 목록 -->
      <section id="screen-list" class="screen list-screen">
        <header class="list-head">
          <h1>곡 목록</h1>
          <p>추가한 음원은 이 기기에만 보관돼요.</p>
        </header>
        <ul id="song-list" class="song-list"></ul>
        <div class="list-actions">
          <label class="btn" for="file">+ 음원 추가</label>
          <input id="file" type="file" accept="audio/*" hidden />
          <button id="metronome" class="btn ghost" type="button">메트로놈 연습</button>
        </div>
        <p id="list-status" class="status" role="status"></p>
      </section>

      <!-- 플레이 -->
      <section id="screen-play" class="screen play-screen" hidden>
        <header class="hud">
          <div class="hud-row">
            <span id="play-title"></span>
            <span id="play-meta"></span>
          </div>
          <div class="hud-row">
            <span id="play-clock" class="clock">0:00.00</span>
            <div id="play-beats" class="beats" aria-hidden="true"></div>
            <span id="play-bar" class="bar">마디 -</span>
          </div>
          <div class="hud-row">
            <span id="play-score" class="score">0000000</span>
            <button id="play-pause" class="btn ghost small" type="button">일시정지</button>
          </div>
        </header>
        <div id="pause-menu" class="menu" hidden>
          <p class="menu-title">일시정지</p>
          <button id="resume" class="btn" type="button">계속하기</button>
          <button id="restart" class="btn ghost" type="button">처음부터</button>
          <button id="quit" class="btn ghost" type="button">나가기</button>
        </div>
      </section>

      <!-- 결과 -->
      <section id="screen-result" class="screen result-screen" hidden>
        <p id="result-title" class="result-title"></p>
        <div class="rank-row">
          <span id="result-rank" class="rank">S</span>
          <div class="rank-side">
            <span id="result-score" class="result-score">0</span>
            <span id="result-best" class="badge" hidden>새 최고 기록</span>
            <span id="result-prev" class="prev"></span>
          </div>
        </div>
        <dl class="result-grid">
          <dt>perfect</dt><dd id="r-perfect">0</dd>
          <dt>great</dt><dd id="r-great">0</dd>
          <dt>good</dt><dd id="r-good">0</dd>
          <dt>miss</dt><dd id="r-miss">0</dd>
          <dt>최대 콤보</dt><dd id="r-combo">0</dd>
          <dt>정확도</dt><dd id="r-acc">0%</dd>
        </dl>
        <p id="result-timing" class="timing"></p>
        <div class="result-actions">
          <button id="again" class="btn" type="button">다시 하기</button>
          <button id="result-back" class="btn ghost" type="button">목록으로</button>
        </div>
      </section>

      <!-- 채보 만들기 -->
      <section id="screen-edit" class="screen edit-screen" hidden>
        <header class="hud">
          <div class="hud-row">
            <span id="edit-title"></span>
            <span id="edit-count">노트 0개</span>
          </div>
          <div class="hud-row">
            <span id="edit-clock" class="clock">0:00.00</span>
            <span id="edit-mode" class="mode-label"></span>
            <button id="edit-stop" class="btn ghost small" type="button">멈춤</button>
          </div>
          <p id="edit-status" class="status edit-status" role="status"></p>
        </header>
        <div id="edit-panel" class="edit-panel">
          <div class="edit-row seek-row">
            <button id="edit-back" class="btn ghost small" type="button">-2초</button>
            <input id="edit-seek" class="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="편집 위치" />
            <button id="edit-fwd" class="btn ghost small" type="button">+2초</button>
          </div>
          <div class="edit-row">
            <button id="edit-record" class="btn small" type="button">● 녹음</button>
            <button id="edit-preview" class="btn ghost small" type="button">▶ 듣기</button>
            <button id="edit-undo" class="btn ghost small" type="button">되돌리기</button>
            <button id="edit-save" class="btn small" type="button">저장</button>
          </div>
          <div class="edit-row">
            <label class="snap">박 맞추기
              <select id="edit-snap">
                <option value="0">끄기</option>
                <option value="1">1박</option>
                <option value="2">1/2박</option>
                <option value="4">1/4박</option>
              </select>
            </label>
            <button id="edit-test" class="btn ghost small" type="button">시험 플레이</button>
            <button id="edit-clear" class="btn ghost small" type="button">전체 지우기</button>
            <button id="edit-exit" class="btn ghost small" type="button">나가기</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
