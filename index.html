<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#171922" />
    <title>Rhythm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <main class="ui">
      <header class="hud">
        <div class="hud-row">
          <span id="song-title">ALWAYS WITH ME</span>
          <span id="song-meta">131 BPM · 3/4</span>
        </div>
        <div class="hud-row">
          <span id="clock" class="clock">0:00.00</span>
          <div id="beats" class="beats" aria-hidden="true"></div>
          <span id="bar" class="bar">마디 -</span>
        </div>
        <div class="hud-row end">
          <button id="pause" class="btn ghost small" type="button">일시정지</button>
        </div>
      </header>

      <section class="panel">
        <div class="source">
          <label class="btn" for="file">음원 파일 고르기</label>
          <input id="file" type="file" accept="audio/*" hidden />
          <button id="metronome" class="btn ghost" type="button">메트로놈으로 연습</button>
        </div>

        <p id="track" class="track">음원을 고르면 여기에 표시돼요.</p>

        <div class="transport">
          <button id="play" class="btn play" type="button" disabled>재생</button>
          <input id="seek" class="seek" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="재생 위치" />
          <span id="duration" class="duration">0:00</span>
        </div>

        <p id="status" class="status" role="status"></p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
