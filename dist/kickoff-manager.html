<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1524">
<title>킥오프 매니저</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%230e1524%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2280%22%20width%3D%22320%22%20height%3D%22352%22%20rx%3D%2218%22%20fill%3D%22%232f7549%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23eef0e6%22%20stroke-width%3D%2210%22%20opacity%3D%22.85%22%3E%3Crect%20x%3D%2296%22%20y%3D%2280%22%20width%3D%22320%22%20height%3D%22352%22%20rx%3D%2218%22%2F%3E%3Cpath%20d%3D%22M96%20256h320%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%2248%22%2F%3E%3Cpath%20d%3D%22M186%2080v52h140V80M186%20432v-52h140v52%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%2222%22%20fill%3D%22%23ffb547%22%2F%3E%3Cg%20fill%3D%22%23ffb547%22%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2260%22%20r%3D%2216%22%2F%3E%3Ccircle%20cx%3D%22442%22%20cy%3D%2260%22%20r%3D%2216%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* 킥오프 매니저 — 야간 경기장 조명 아래의 전광판 느낌. 단일 다크 테마. */
/* Layout: 모바일 앱 셸(최대 520px) — 상단 구단 바, 스크롤 본문, 하단 탭 */
:root {
  --ink: #0e1524;        /* 밤하늘 배경 */
  --panel: #161f33;      /* 카드 */
  --panel-2: #1d2840;    /* 눌린/보조 면 */
  --rule: #2a3754;       /* 구분선 */
  --chalk: #eef0e6;      /* 본문 글자 (분필 흰색) */
  --muted: #8f9bb3;      /* 보조 글자 */
  --flood: #ffb547;      /* 강조: 투광등 앰버 */
  --flood-ink: #2a1a00;
  --turf: #2f7549;       /* 잔디 */
  --win: #4cc38a;
  --draw: #d6c35a;
  --loss: #f06363;
  --info: #6aa8ff;
  --f-display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --f-num: "Saira Semi Condensed", "Noto Sans KR", system-ui, sans-serif;
  --r: 14px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--chalk);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--flood); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; }

/* 상단 바 */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--ink) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.topbar .club { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
.topbar .club b { font-family: var(--f-display); font-size: 18px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .meta { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.topbar .bal { text-align: right; font-size: 11px; color: var(--muted); line-height: 1.25; }
.topbar .bal .num { color: var(--chalk); font-size: 15px; font-weight: 600; display: block; }

.crest {
  width: 34px; height: 34px; border-radius: 50% 50% 46% 46% / 40% 40% 60% 60%;
  display: grid; place-items: center; flex: none;
  font-family: var(--f-num); font-weight: 700; font-size: 11px; letter-spacing: .02em;
  border: 2.5px solid; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18);
}
.crest.sm { width: 24px; height: 24px; font-size: 8.5px; border-width: 2px; }
.crest.lg { width: 56px; height: 56px; font-size: 16px; border-width: 3.5px; }

main.view {
  padding-block: 14px calc(88px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}

/* 하단 탭 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: flex; justify-content: center;
  background: color-mix(in srgb, var(--ink) 94%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .in { display: flex; width: 100%; max-width: 520px; }
nav.tabs button {
  flex: 1; background: none; border: 0; padding: 8px 0 9px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; position: relative;
}
nav.tabs button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--flood); }
nav.tabs button .dot { position: absolute; top: 5px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--loss); }

/* 카드 */
.card { background: var(--panel); border-radius: var(--r); padding: 14px; min-width: 0; }
.card > h2, .sec-title { font-family: var(--f-display); font-size: 17px; letter-spacing: .01em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.sec-title small, .card > h2 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-left: auto; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* 버튼 */
.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600;
  background: var(--panel-2); color: var(--chalk); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.primary { background: var(--flood); color: var(--flood-ink); font-weight: 700; }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btn.ghost { background: transparent; border: 1px solid var(--rule); }
.btn.danger { background: color-mix(in srgb, var(--loss) 22%, var(--panel-2)); color: #ffd9d9; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.big { padding: 16px; font-size: 16px; font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; }

/* 세그먼트 */
.seg { display: flex; background: var(--panel-2); border-radius: 11px; padding: 3px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--chalk); color: var(--ink); font-weight: 600; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.chip.on { border-color: var(--flood); color: var(--flood); }

/* 목록 */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--rule); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li.tap { cursor: pointer; }
.li.tap:active { background: var(--panel-2); }
.li .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ovr {
  font-family: var(--f-num); font-weight: 700; font-size: 16px; width: 38px; text-align: center; flex: none;
  border-radius: 8px; padding: 3px 0; font-variant-numeric: tabular-nums;
}
.ovr.t1 { background: #ffd36b; color: #2a1a00; }
.ovr.t2 { background: #b9e4c9; color: #10301e; }
.ovr.t3 { background: #9fb6d8; color: #0f1d33; }
.ovr.t4 { background: #59657d; color: #eef0e6; }
.pos { font-family: var(--f-num); font-weight: 700; font-size: 11px; width: 30px; text-align: center; border-radius: 6px; padding: 2px 0; flex: none; }
.pos.GK { background: #5b4b16; color: #ffe08a; }
.pos.DF { background: #173a5c; color: #9fd0ff; }
.pos.MF { background: #18452f; color: #9be7bd; }
.pos.FW { background: #5a1d22; color: #ffb0b0; }

.bar { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--win); }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.tag.red { background: color-mix(in srgb, var(--loss) 25%, transparent); color: #ffc2c2; }
.tag.amber { background: color-mix(in srgb, var(--flood) 22%, transparent); color: var(--flood); }
.tag.green { background: color-mix(in srgb, var(--win) 22%, transparent); color: #b5f0d1; }

.form { display: inline-flex; gap: 3px; }
.form i { width: 16px; height: 16px; border-radius: 4px; font-style: normal; font-size: 10px; font-weight: 700; display: grid; place-items: center; color: #0e1524; font-family: var(--f-num); }
.form i.W { background: var(--win); } .form i.D { background: var(--draw); } .form i.L { background: var(--loss); }

/* 표 */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-weight: 500; color: var(--muted); font-size: 11px; text-align: center; padding: 6px 3px; border-bottom: 1px solid var(--rule); }
.tbl td { padding: 7px 3px; text-align: center; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.tbl td.tn { text-align: left; font-family: var(--f-body); white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.tbl tr.me td { background: color-mix(in srgb, var(--flood) 14%, transparent); }
.tbl tr.me td.tn { font-weight: 700; color: var(--flood); }
.tbl td.zone { width: 4px; padding: 0; }
.tbl td.zone.up { background: var(--win); } .tbl td.zone.down { background: var(--loss); }
.tbl td.pts { font-weight: 700; }

/* 다음 경기 */
.fixture { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.fixture .tm { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.fixture .tm b { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.fixture .vs { font-family: var(--f-display); font-size: 22px; color: var(--muted); }
.fixture .sc { font-family: var(--f-num); font-weight: 700; font-size: 34px; letter-spacing: .04em; }

.hero-match { background: linear-gradient(180deg, color-mix(in srgb, var(--turf) 38%, var(--panel)) 0%, var(--panel) 70%); }

/* 뉴스 */
.news .li { align-items: flex-start; }
.news .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--panel-2); display: grid; place-items: center; flex: none; font-size: 13px; }
.news .t { font-weight: 600; font-size: 13.5px; }
.news .b { font-size: 12.5px; color: var(--muted); }

/* 모달 시트 */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(4,8,16,.62); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; background: var(--panel);
  border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: rise .22s cubic-bezier(.2,.8,.2,1);
}
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: -6px auto 0; }
.sheet h2 { font-family: var(--f-display); font-size: 20px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(30px); opacity: .6; } }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70;
  background: var(--chalk); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px;
  max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: rise .2s ease;
}

/* 능력치 */
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.attr { display: grid; grid-template-columns: 52px 1fr 26px; align-items: center; gap: 8px; font-size: 12.5px; }
.attr .num { text-align: right; font-weight: 600; }
.stars { color: var(--flood); letter-spacing: 1px; font-size: 13px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kv small { display: block; color: var(--muted); font-size: 11px; }
.kv b { font-family: var(--f-num); font-size: 16px; font-weight: 600; }

/* 라인업 편집 경기장 */
.pitch-ed {
  position: relative; width: 100%; aspect-ratio: 68 / 80; max-width: 100%; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(180deg, #2f7549 0 10%, #2a6b43 10% 20%);
  border: 2px solid rgba(240,245,235,.5);
}
.pitch-ed::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: -2px; height: 18%; border: 2px solid rgba(240,245,235,.5); border-bottom: 0; }
.pitch-ed::after { content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 0; border-top: 2px solid rgba(240,245,235,.5); }
.pitch-ed .halfc { position: absolute; left: 50%; top: 0; width: 28%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid rgba(240,245,235,.5); border-radius: 50%; }
.slot {
  position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: none; border: 0; padding: 0; width: 64px;
}
.slot .disc {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 14px;
  border: 2.5px solid; box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.slot .lbl { font-size: 10.5px; font-weight: 600; background: rgba(8,14,26,.72); padding: 0 5px; border-radius: 5px; max-width: 64px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .rt { font-family: var(--f-num); font-size: 10px; color: #ffe2a6; }
.slot.sel .disc { outline: 3px solid var(--flood); outline-offset: 2px; }
.slot.bad .lbl { color: #ffb0b0; }

/* 경기 화면 */
.match-screen { position: fixed; inset: 0; z-index: 40; background: var(--ink); overflow-y: auto; }
.match-screen .in {
  max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.scoreboard {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: #070b14; border-radius: 14px; padding: 10px 12px; border: 1px solid var(--rule);
}
.scoreboard .tm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.scoreboard .tm.away { flex-direction: row-reverse; text-align: right; }
.scoreboard .tm b { font-family: var(--f-display); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scoreboard .mid { text-align: center; }
.scoreboard .score { font-family: var(--f-num); font-size: 32px; font-weight: 700; line-height: 1; color: var(--flood); letter-spacing: .06em; }
.scoreboard .clock { font-family: var(--f-num); font-size: 13px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.possbar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; }
.pitch-wrap { position: relative; }
canvas.pitch { width: 100%; display: block; border-radius: 12px; }
.flash {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none;
  font-family: var(--f-display); font-size: 54px; color: var(--flood); text-shadow: 0 4px 0 #3a2400, 0 0 30px rgba(255,181,71,.6);
  animation: pop 1.6s ease forwards; white-space: nowrap; text-align: center; line-height: 1.1;
}
.flash small { display: block; font-family: var(--f-body); font-size: 15px; font-weight: 700; color: var(--chalk); text-shadow: 0 2px 6px #000; }
.flash.red { color: #ff6b6b; text-shadow: 0 4px 0 #3a0000; font-size: 40px; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 25% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
.ctrl { display: flex; gap: 6px; }
.ctrl .btn { flex: 1; padding: 9px 6px; font-size: 13px; }
.feed { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; }
.feed .ev { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.feed .ev .t { font-family: var(--f-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.feed .ev.goal { color: var(--flood); font-weight: 700; }
.feed .ev.red .x { color: var(--loss); font-weight: 600; }
.statrow { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; font-size: 12.5px; padding: 5px 0; }
.statrow .num { font-weight: 600; }
.statrow .num:last-child { text-align: right; }
.statrow .mid { text-align: center; color: var(--muted); }
.dual { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--panel-2); gap: 2px; margin-top: 3px; }
.mom { width: 100%; height: 90px; display: block; }

.rating { font-family: var(--f-num); font-weight: 700; font-size: 13px; padding: 1px 6px; border-radius: 6px; min-width: 34px; text-align: center; }
.rating.hi { background: var(--win); color: #062614; }
.rating.mid { background: var(--panel-2); }
.rating.lo { background: color-mix(in srgb, var(--loss) 40%, var(--panel-2)); }

/* 시작 화면 */
.title-screen { min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-block: calc(40px + env(safe-area-inset-top, 0px)) 30px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 520px; margin: 0 auto; }
.logo { font-family: var(--f-display); font-size: 44px; line-height: 1.02; letter-spacing: -.01em; }
.logo em { font-style: normal; color: var(--flood); display: block; }
.lights { display: flex; gap: 8px; margin-bottom: 4px; }
.lights i { width: 14px; height: 14px; border-radius: 50%; background: var(--flood); box-shadow: 0 0 18px 4px rgba(255,181,71,.55); animation: glow 2.4s ease-in-out infinite; }

        outfield.sort((a, c) => dist(a.x, a.y, px, py) - dist(c.x, c.y, px, py));
        let k = owner ? 1 + (press >= 1 ? 1 : 0) + (press >= 2 ? 1 : 0) : 2;
        const radius = owner ? 12 + press * 7 : 30;
        for (let i = 0; i < outfield.length && i < k; i++) {
          const m = outfield[i];
          const d = dist(m.x, m.y, px, py);
          if (i > 0 && d > radius) break;
          // 첫 번째 압박수는 골문 쪽에서 접근
          const gx = s === 0 ? 0 : LEN;
          const off = owner ? 1.0 : 0;
          const ang = Math.atan2(34 - py, gx - px);
          m.tx = px + Math.cos(ang) * off; m.ty = py + Math.sin(ang) * off;
          m.chase = true;
        }
        if (!owner && !this.pass && !this.shot) {
          // 골키퍼: 박스 안 루즈볼은 직접 처리
          const gk = players.find((m) => m.grp === 'GK');
          if (gk && fx(s, b.x) < 16 && Math.abs(b.y - 34) < 20) { gk.tx = b.x; gk.ty = b.y; gk.chase = true; }
        }
      }
      // 패스 받는 선수는 공 도착 지점으로
      if (this.pass && this.pass.to.side === s && this.pass.to.on) {
        this.pass.to.tx = this.pass.tx; this.pass.to.ty = this.pass.ty;
      }
    }
  };

  M.movePlayers = function (frozenBall) {
    const b = this.ball;
    for (const m of this.all()) {
      if (m.stun > 0) m.stun -= DT;
      if (m.protect > 0) m.protect -= DT;
      let tx = m.tx, ty = m.ty;
      if (m === b.owner) { tx = m.dx != null ? m.dx : m.x; ty = m.dy != null ? m.dy : m.y; }
      const dx = tx - m.x, dy = ty - m.y;
      const d = Math.hypot(dx, dy);
      let spd = m.maxSpd * (0.68 + 0.32 * m.st);
      if (m === b.owner) {
        spd *= 0.74 + 0.12 * (m.a.dri / 100);
        if (m.blocked) spd *= 0.45;
      }
      if (m.injured) spd *= 0.5;
      let want = d > 4 || m.chase ? spd : d > 0.3 ? spd * (d / 4) * 0.8 : 0;
      if (this.state !== 'play' && !m.chase) want *= 0.7;
      let vx = d > 0.01 ? (dx / d) * want : 0, vy = d > 0.01 ? (dy / d) * want : 0;
      m.vx = lerp(m.vx, vx, 0.25); m.vy = lerp(m.vy, vy, 0.25);
      m.x = clamp(m.x + m.vx * DT, -1, LEN + 1);
      m.y = clamp(m.y + m.vy * DT, -1, WID + 1);
      const r = Math.hypot(m.vx, m.vy) / m.maxSpd;
      const press = this.tac(m.side).press;
      const drain = (0.00011 + 0.00042 * r * r * (m.chase ? 1 + press * 0.15 : 1)) * (1.25 - (m.a.phy / 100) * 0.5);
      m.st = Math.max(0.05, m.st - drain * DT);
    }
    if (b.owner) {
      const o = b.owner;
      const dir = o.side === 0 ? 1 : -1;
      b.x = o.x + dir * 0.6; b.y = o.y + Math.sin(this.t * 6) * 0.15;
    }
  };

  // ── 공을 가진 선수 판단 ────────────────────────────────────
  M.carrierLogic = function () {
    const m = this.ball.owner;
    if (!m) return;
    const s = m.side;
    const opps = this.onPitch(1 - s);
    let nearest = 99;
    for (const o of opps) { const d = dist(o.x, o.y, m.x, m.y); if (d < nearest) nearest = d; }
    // 진행 방향 앞을 막는 수비수
    m.blocked = false;
    const dir = s === 0 ? 1 : -1;
    for (const o of opps) {
      const ahead = (o.x - m.x) * dir;
      if (ahead > 0 && ahead < 3 && Math.abs(o.y - m.y) < 1.8) { m.blocked = true; break; }
    }
    m.hold -= DT;
    if (nearest < 3 && m.hold > 0.25 && m.grp !== 'GK') m.hold = Math.min(m.hold, 0.12 + this.rng.next() * 0.3);
    if (m.hold > 0) {
      if (m.dx == null) this.setDribble(m, opps);
      return;
    }
    this.decide(m, opps);
  };

  M.setDribble = function (m, opps) {
    const s = m.side;
    const f = fx(s, m.x), y = fy(s, m.y);
    let ty = lerp(y, 34, f > 70 ? 0.35 : 0.1);
    // 가까운 수비수 반대쪽으로
    let near = null, nd = 99;
    for (const o of opps) { const d = dist(o.x, o.y, m.x, m.y); if (d < nd) { nd = d; near = o; } }
    if (near && nd < 6) ty += (fy(s, m.y) - fy(s, near.y) >= 0 ? 1 : -1) * 4;
    const tf = clamp(f + (m.grp === 'GK' ? 0 : 7), 1, LEN - 1);
    ty = clamp(ty, 2, WID - 2);
    m.dx = s === 0 ? tf : LEN - tf; m.dy = s === 0 ? ty : WID - ty;
  };

  M.decide = function (m, opps) {
    const s = m.side, tac = this.tac(s);
    const men = tac.mentality - 2;
    const f = fx(s, m.x), y = fy(s, m.y);
    const options = [];
    const eps = 0.0015;
    const curV = threat(f, y);
    // 상대 가장 가까운 거리
    let nearest = 99;
    for (const o of opps) { const d = dist(o.x, o.y, m.x, m.y); if (d < nearest) nearest = d; }

    // 슈팅
    if (f > 70 && m.grp !== 'GK') {
      let xg = xgAt(f, y);
      if (nearest < 2) xg *= 0.6;
      // 슛 경로 차단 수비수
      let blockers = 0;
      for (const o of opps) {
        const of = fx(s, o.x), oy = fy(s, o.y);
        if (of > f && of < LEN - 1 && segDist(of, oy, f, y, LEN, 34) < 1.2) blockers++;
      }
      xg *= Math.pow(0.7, blockers);
      const d = Math.hypot(LEN - f, 34 - y);
      const longBonus = d > 16 && d < 28 ? 0.45 + (m.a.sho - 60) / 60 : 0;
      const u = Math.log(xg * (1 + men * 0.12) * (0.75 + m.a.sho / 200) + eps) - 0.25 + longBonus;
      options.push({ k: 'shoot', u, xg });
    }
    // 패스
    const style = tac.style;
    for (const t of this.onPitch(s)) {
      if (t === m || t.injured) continue;
      const lead = 0.35;
      const tX = clamp(t.x + t.vx * lead * 2, 1, LEN - 1), tY = clamp(t.y + t.vy * lead * 2, 1, WID - 1);
      const L = dist(m.x, m.y, tX, tY);
      if (L < 4 || L > 55) continue;
      const tf = fx(s, tX), ty = fy(s, tY);
      if (t.grp === 'GK' && f > 40) continue;
      const lofted = L > 26;
      let risk = 0;
      for (const o of opps) {
        const of = fx(s, o.x), oy = fy(s, o.y);
        const sd = segDistT(of, oy, f, y, tf, ty);
        if (lofted && sd.t < 0.8) continue;
        const reach = 1.4 + L * 0.035 + (o.a.pac / 100) * 0.8;
        if (sd.d < reach) risk += (1 - sd.d / reach) * (0.35 + o.a.def / 220);
      }
      let rp = 99;
      for (const o of opps) { const d = dist(o.x, o.y, tX, tY); if (d < rp) rp = d; }
      if (rp < 1.5) risk += 0.35; else if (rp < 3.5) risk += 0.12;
      risk += (L / 55) * 0.18 * (1.2 - m.a.pas / 100);
      if (lofted) risk += 0.08;
      risk = clamp(risk * (style === 0 ? 1.3 : style === 2 ? 0.85 : 1) * (1 - men * 0.06), 0, 0.95);
      const danger = 0.6 * Math.max(0, 1 - f / 60);
      let u = Math.log(threat(tf, ty) * (1 - risk) + eps) + Math.log(1 - risk * danger + 1e-6);
      if (style === 0) u -= L * 0.006;
      if (style === 2) u += Math.max(0, tf - f) * 0.006;
      if (tf < f - 5) u -= 0.05;
      // 측면 크로스 보너스
      if (f > 85 && Math.abs(y - 34) > 14 && tf > 88 && Math.abs(ty - 34) < 10) u += 0.25;
      options.push({ k: 'pass', u, t, tX, tY, L, lofted });
    }
    // 드리블
    if (m.grp !== 'GK') {
      const df = clamp(f + 6, 0, LEN), dy = lerp(y, 34, 0.15);
      let pr = 0;
      for (const o of opps) {
        const of = fx(s, o.x), oy = fy(s, o.y);
        if (of > f - 1 && dist(of, oy, df, dy) < 6) pr += 0.22 * (0.6 + o.a.def / 150);
      }
      pr = clamp(pr * (1.25 - m.a.dri / 100), 0, 0.9);
      const u = Math.log(threat(df, dy) * (1 - pr) + eps) + Math.log(1 - pr * 0.6 * Math.max(0, 1 - f / 60) + 1e-6) - 0.08;
      options.push({ k: 'dribble', u });
    }
    // 소프트맥스 선택
    const T = 0.22 + (1 - m.a.pas / 100) * 0.25;
    let mx = -1e9;
    for (const o of options) if (o.u > mx) mx = o.u;
    let sum = 0;
    for (const o of options) { o.w = Math.exp((o.u - mx) / T); sum += o.w; }
    let r = this.rng.next() * sum, pick = options[options.length - 1];
    for (const o of options) { r -= o.w; if (r <= 0) { pick = o; break; } }

    m.dx = null;
    if (pick.k === 'shoot') this.doShot(m, pick.xg);
    else if (pick.k === 'pass') this.doPass(m, pick);
    else { m.hold = 0.5 + this.rng.next() * 0.5; this.setDribble(m, opps); m.s.drb++; }
  };

  function segDistT(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy || 1;
    let t = ((px - ax) * dx + (py - ay) * dy) / l2;
    t = clamp(t, 0, 1);
    return { d: Math.hypot(px - (ax + t * dx), py - (ay + t * dy)), t };
  }
  function segDist(px, py, ax, ay, bx, by) { return segDistT(px, py, ax, ay, bx, by).d; }

  M.doPass = function (m, o) {
    const rng = this.rng;
    const err = (0.035 + (1 - m.a.pas / 100) * 0.11) * (1 + o.L / 40) * (m.st < 0.5 ? 1.2 : 1);
    const ang = Math.atan2(o.tY - m.y, o.tX - m.x) + rng.gauss(0, err);
    const L = o.L * (1 + rng.gauss(0, err * 0.6));
    const tx = clamp(m.x + Math.cos(ang) * L, -2, LEN + 2), ty = clamp(m.y + Math.sin(ang) * L, -2, WID + 2);
    const speed = o.lofted ? 19 : clamp(11 + o.L * 0.35, 12, 21);
    this.pass = { from: m, to: o.t, sx: m.x, sy: m.y, tx, ty, L: Math.max(1, dist(m.x, m.y, tx, ty)), prog: 0, speed, lofted: o.lofted, tried: new Set(), cross: this.setPiece || (fx(m.side, m.x) > 82 && Math.abs(m.y - 34) > 14) };
    const b = this.ball;
    b.owner = null; b.mode = 'pass';
    this.secondPasser = this.lastPasser;
    this.lastPasser = m;
    m.s.pass++; this.stats[m.side].pass++;
    this.setPiece = null;
  };

  M.doShot = function (m, xg) {
    const rng = this.rng, s = m.side;
    const opps = this.onPitch(1 - s);
    const gk = opps.find((o) => o.grp === 'GK');
    const header = this.pass == null && m.recvCross;
    const skill = header ? (m.a.phy * 0.6 + m.a.sho * 0.4) : m.a.sho;
    const gkSkill = gk ? gk.a.gk : 30;
    let pGoal = xg * (0.55 + skill / 110) * (1.45 - gkSkill / 110);
    pGoal = clamp(pGoal * 0.85, 0.005, 0.9);
    const f = fx(s, m.x), y = fy(s, m.y);
    const d = Math.hypot(LEN - f, 34 - y);
    const pOn = clamp(0.32 + skill / 250 - d * 0.006, 0.18, 0.75);
    let blocked = false;
    for (const o of opps) {
      const of = fx(s, o.x), oy = fy(s, o.y);
      if (o.grp !== 'GK' && of > f && of < f + 8 && segDist(of, oy, f, y, LEN, 34) < 1.0 && rng.chance(0.35)) { blocked = o; break; }
    }
    let outcome;
    const r = rng.next();
    if (blocked) outcome = 'block';
    else if (r < pGoal) outcome = 'goal';
    else if (r < Math.max(pOn, pGoal + 0.05)) outcome = 'save';
    else outcome = 'wide';
    let gy;
    if (outcome === 'goal') gy = rng.range(GOAL_Y0 + 0.3, GOAL_Y1 - 0.3);
    else if (outcome === 'save') gy = rng.range(GOAL_Y0 + 1, GOAL_Y1 - 1);
    else gy = rng.chance(0.5) ? rng.range(GOAL_Y0 - 6, GOAL_Y0 - 0.5) : rng.range(GOAL_Y1 + 0.5, GOAL_Y1 + 6);
    const gx = s === 0 ? LEN + 0.5 : -0.5;
    const ty = s === 0 ? gy : WID - gy;
    this.shot = { by: m, sx: m.x, sy: m.y, tx: blocked ? blocked.x : gx, ty: blocked ? blocked.y : ty, outcome, xg, gk, blocked, prog: 0, L: 1 };
    this.shot.L = Math.max(1, dist(m.x, m.y, this.shot.tx, this.shot.ty));
    const b = this.ball; b.owner = null; b.mode = 'shot';
    m.s.shots++; this.stats[s].shots++; this.stats[s].xg += xg;
    if (outcome === 'goal' || outcome === 'save') { m.s.sot++; this.stats[s].sot++; }
    this.shotAssist = this.lastPasser && this.lastPasser.side === s && this.lastPasser !== m ? this.lastPasser : null;
    if (this.shotAssist) this.shotAssist.s.key++;
    m.recvCross = false;
  };

  // ── 공 처리 ─────────────────────────────────────────────────
  M.ballLogic = function () {
    const b = this.ball, rng = this.rng;
    if (this.shot) {
      const sh = this.shot;
      sh.prog += (28 * DT) / sh.L;
      const t = Math.min(1, sh.prog);
      b.x = lerp(sh.sx, sh.tx, t); b.y = lerp(sh.sy, sh.ty, t); b.z = Math.sin(t * Math.PI) * 0.6;
      if (sh.gk && sh.outcome === 'save') { sh.gk.tx = b.x; sh.gk.ty = sh.ty; }
      if (sh.prog >= 1) this.resolveShot();
      return;
    }
    if (this.pass) {
      const p = this.pass;
      p.prog += (p.speed * DT) / p.L;
      const t = Math.min(1, p.prog);
      b.x = lerp(p.sx, p.tx, t); b.y = lerp(p.sy, p.ty, t);
      b.z = p.lofted ? Math.sin(t * Math.PI) * 3 : 0;
      // 가로채기
      const airborne = p.lofted && t < 0.78;
      if (!airborne) {
        for (const o of this.onPitch(1 - p.from.side)) {
          if (p.tried.has(o)) continue;
          const d = dist(o.x, o.y, b.x, b.y);
          const reach = o.grp === 'GK' ? 2.4 : 1.6;
          if (d < reach) {
            p.tried.add(o);
            let pi = 0.22 + o.a.def / 260 + (p.speed < 15 ? 0.1 : 0);
            if (o.grp === 'GK') pi = 0.35 + o.a.gk / 200;
            if (p.cross && o.grp === 'DF') pi += 0.12;
            if (rng.chance(pi)) {
              o.s.int++;
              this.pass = null;
              p.from.s.lost++;
              if (rng.chance(o.grp === 'GK' ? 0.85 : 0.65)) this.giveBall(o);
              else this.looseBall(o.x, o.y, 6);
              this.lastTouch = o.side;
              return;
            }
          }
        }
      }
      // 수신
      const r = p.to;
      if (r.on && !airborne && dist(r.x, r.y, b.x, b.y) < 1.5) {
        const fail = 0.03 + (1 - r.a.dri / 100) * 0.05 + (p.lofted ? 0.06 : 0);
        p.from.s.passOk++; this.stats[p.from.side].passOk++;
        if (rng.chance(fail)) { this.pass = null; this.looseBall(r.x, r.y, 4); this.lastTouch = r.side; return; }
        this.giveBall(r);
        r.dx = null;
        if (p.cross && fx(r.side, r.x) > 86) { r.recvCross = true; r.hold = 0.08; }
        else r.recvCross = false;
        return;
      }
      if (p.prog >= 1) {
        const dx = p.tx - p.sx, dy = p.ty - p.sy, l = Math.hypot(dx, dy) || 1;
        this.pass = null;
        b.mode = 'free'; b.vx = (dx / l) * 5; b.vy = (dy / l) * 5;
        this.lastTouch = p.from.side;
      }
      this.checkOut();
      return;
    }
    if (b.mode === 'free') {
      b.x += b.vx * DT; b.y += b.vy * DT; b.vx *= 0.93; b.vy *= 0.93; b.z = 0;
      if (this.checkOut()) return;
      // 줍기
      let best = null, bd = 99, contest = null;
      for (const m of this.all()) {
        if (m.stun > 0 && m.grp !== 'GK') continue;
        const d = dist(m.x, m.y, b.x, b.y);
        if (d < 1.1 && d < bd) { contest = best && best.side !== m.side ? best : contest; bd = d; best = m; }
      }
      if (best) {
        if (contest && rng.chance(contest.a.phy / (contest.a.phy + best.a.phy))) best = contest;
        this.giveBall(best);
      }
    }
  };

  M.looseBall = function (x, y, v) {
    const b = this.ball, a = this.rng.next() * Math.PI * 2;
    b.owner = null; b.mode = 'free'; b.x = x; b.y = y; b.vx = Math.cos(a) * v; b.vy = Math.sin(a) * v;
  };

  M.checkOut = function () {
    const b = this.ball;
    if (b.x >= 0 && b.x <= LEN && b.y >= 0 && b.y <= WID) return false;
    const last = this.lastTouch;
    this.pass = null;
    b.owner = null; b.mode = 'dead'; b.vx = b.vy = 0;
    if (b.y < 0 || b.y > WID) {
      // 스로인
      const side = 1 - last;
      this.setRestart('throw', side, clamp(b.x, 1, LEN - 1), b.y < 0 ? 0.2 : WID - 0.2);
    } else {
      // 골라인
      const atkSide = b.x > LEN ? 0 : 1; // 이 골라인을 공격하는 쪽
      if (last === atkSide) this.setRestart('goalkick', 1 - atkSide);
      else this.setRestart('corner', atkSide, b.x > LEN ? LEN - 0.3 : 0.3, b.y < 34 ? 0.3 : WID - 0.3);
    }
    return true;
  };

  M.setRestart = function (kind, side, x, y) {
    this.state = 'dead';
    this.timer = kind === 'corner' ? 2.4 : kind === 'goalkick' ? 2 : kind === 'pen' ? 2.5 : 1.3;
    const b = this.ball;
    let taker;
    if (kind === 'goalkick' || kind === 'gkhold') {
      taker = this.onPitch(side).find((m) => m.grp === 'GK') || this.onPitch(side)[0];
      x = side === 0 ? 5.5 : LEN - 5.5; y = 34;
    } else if (kind === 'pen') {
      const cands = this.onPitch(side).filter((m) => m.grp !== 'GK').sort((a, c) => c.a.sho - a.a.sho);
      taker = cands[0];
      x = side === 0 ? LEN - 11 : 11; y = 34;
    } else {
      const cands = this.onPitch(side).filter((m) => m.grp !== 'GK');
      cands.sort((a, c) => dist(a.x, a.y, x, y) - dist(c.x, c.y, x, y));
      taker = cands[0];
    }
    b.x = x; b.y = y;
    this.restart = { kind, side, taker, x, y };
    taker.tx = x; taker.ty = y; taker.chase = true;
    this.setPiece = kind === 'corner' ? { side } : null;
    this.poss = side;
    if (kind === 'corner') { this.stats[side].corners++; }
  };

  M.doRestart = function () {
    const r = this.restart;
    this.restart = null;
    this.state = 'play';
    if (!r || !r.taker.on) { this.looseBall(this.ball.x, this.ball.y, 0); return; }
    r.taker.x = r.x; r.taker.y = r.y;
    if (r.kind === 'pen') {
      this.giveBall(r.taker, 0);
      const s = r.taker.side;
      this.log('chance', s, `${r.taker.p.name}, 페널티킥 키커로 나섭니다.`);
      this.doShot(r.taker, 0.78);
      return;
    }
    this.giveBall(r.taker, r.kind === 'corner' ? 0.05 : r.kind === 'goalkick' ? 0.8 : 0.2);
    if (r.kind === 'corner') this.setPiece = { side: r.side };
  };

  M.resolveShot = function () {
    const sh = this.shot, m = sh.by, s = m.side, rng = this.rng;
    this.shot = null;
    const b = this.ball;
    const name = m.p.name, team = this.sides[s].team;
    if (sh.outcome === 'goal') {
      this.score[s]++;
      m.s.goals++;
      const ast = this.shotAssist;
      if (ast) ast.s.ast++;
      const ev = this.log('goal', s, `골! ${team.name}의 ${name}${ast ? ` (도움: ${ast.p.name})` : ''}`, { pid: m.id, ast: ast ? ast.id : null, xg: sh.xg });
      this.goalsList.push(ev);

      xi.forEach((x) => rec.set(x.p.id, { p: x.p, role: x.role, mins: 90, goals: 0, ast: 0, yel: 0, red: false, inj: 0, cond: 0 }));
      // 교체 3명
      const outs = rng.shuffle(xi.filter((x) => x.role !== 'GK').slice()).slice(0, subs.length);
      outs.forEach((o, i) => {
        const m = rng.int(55, 85);
        rec.get(o.p.id).mins = m;
        rec.set(subs[i].id, { p: subs[i], role: o.role, mins: 90 - m, goals: 0, ast: 0, yel: 0, red: false, inj: 0 });
      });
      const list = [...rec.values()];
      for (let g = 0; g < goals; g++) {
        const sc = weighted(rng, list, (r) => (r.role === 'GK' ? 0.01 : (r.p.attr.sho / 40) ** 3 * roleGoalW(r.role)) * r.mins);
        sc.goals++;
        if (rng.chance(0.72)) {
          const as = weighted(rng, list.filter((r) => r !== sc), (r) => (r.role === 'GK' ? 0.02 : (r.p.attr.pas / 40) ** 3 * roleAstW(r.role)) * r.mins);
          if (as) as.ast++;
        }
      }
      for (const r of list) {
        if (rng.chance(0.09 * r.mins / 90)) r.yel = 1;
        if (rng.chance(0.004)) r.red = true;
        if (rng.chance(0.006)) r.inj = rng.int(1, 6);
        let rt = 6.4 + rng.gauss(0, 0.55) + r.goals * 0.9 + r.ast * 0.55 + (goals > conceded ? 0.3 : goals < conceded ? -0.3 : 0);
        if ((r.role === 'GK' || ['CB', 'LB', 'RB'].includes(r.role))) rt += conceded === 0 ? 0.5 : -conceded * 0.2;
        r.rating = clamp(Math.round(rt * 10) / 10, 4, 10);
        r.endSt = clamp(r.p.cond / 100 - 0.28 * r.mins / 90, 0.3, 1);
        r.cs = conceded === 0 && (r.role === 'GK' || ['CB', 'LB', 'RB'].includes(r.role));
        res.players.push(r);
      }
    }
    if (knockout && hs === as) res.pens = shootout(rng);
    return res;
  }
  function roleGoalW(r) { return r === 'ST' ? 3.2 : r === 'LW' || r === 'RW' ? 2.2 : r === 'AM' ? 1.6 : r === 'LM' || r === 'RM' || r === 'CM' ? 0.8 : r === 'DM' ? 0.4 : 0.3; }
  function roleAstW(r) { return r === 'AM' ? 2.2 : r === 'LW' || r === 'RW' || r === 'LM' || r === 'RM' ? 1.9 : r === 'CM' ? 1.3 : r === 'ST' ? 1.2 : r === 'LB' || r === 'RB' ? 0.8 : 0.4; }
  function mentF(t) { return 1 + (t.tactics.mentality - 2) * 0.07; }
  function effRating(G, t) {
    const base = W.teamRating(G, t);
    const cond = t.lineup.reduce((s, id) => s + G.players[id].cond, 0) / t.lineup.length;
    const mor = t.lineup.reduce((s, id) => s + G.players[id].morale, 0) / t.lineup.length;
    return base + (cond - 85) * 0.08 + (mor - 60) * 0.04;
  }
  function poisson(rng, l) {
    const L = Math.exp(-l); let k = 0, p = 1;
    do { k++; p *= rng.next(); } while (p > L && k < 12);
    return k - 1;
  }
  function weighted(rng, arr, f) {
    let sum = 0; const w = arr.map((x) => { const v = Math.max(0, f(x)); sum += v; return v; });
    if (sum <= 0) return arr[0];
    let r = rng.next() * sum;
    for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; }
    return arr[arr.length - 1];
  }
  function shootout(rng) {
    let h = 0, a = 0;
    for (let i = 0; i < 5; i++) { if (rng.chance(0.76)) h++; if (rng.chance(0.76)) a++; }
    while (h === a) { if (rng.chance(0.76)) h++; if (rng.chance(0.76)) a++; }
    return [h, a];
  }

  // 엔진 결과 → 공통 결과 형식
  function engineResult(G, match) {
    const res = { hs: match.score[0], as: match.score[1], pens: null, players: [], engine: true };
    for (const m of match.ratings()) {
      res.players.push({
        p: m.p, role: m.role, mins: m.mins, goals: m.s.goals, ast: m.s.ast,
        yel: m.yellow ? 1 : 0, red: !!m.red, inj: m.injured ? m.injWeeks : 0, rating: m.rating, endSt: m.st,
        cs: match.score[1 - m.side] === 0 && (m.grp === 'GK' || m.grp === 'DF') && m.mins >= 60,
      });
    }
    return res;
  }

  // ── 결과 반영 ───────────────────────────────────────────────
  function applyResult(G, fxm, res, comp) {
    fxm.hs = res.hs; fxm.as = res.as;
    if (res.pens) fxm.pens = res.pens;
    const played = new Set();
    for (const r of res.players) {
      const p = r.p;
      played.add(p.id);
      for (const st of [p.season, p.career]) {
        st.apps++; st.goals += r.goals; st.assists += r.ast; st.yel += r.yel; st.red += r.red ? 1 : 0; st.rsum += r.rating;
        if (r.cs) st.cs++;
      }
      p.ratings.push(r.rating); if (p.ratings.length > 6) p.ratings.shift();
      p.form = p.ratings.reduce((a, b) => a + b, 0) / p.ratings.length;
      p.cond = Math.round(clamp(r.endSt * 100, 25, 100));
      if (r.yel) { p.yAcc = (p.yAcc || 0) + 1; if (p.yAcc >= 5) { p.yAcc = 0; p.sus = Math.max(p.sus, 1); } }
      if (r.red) p.sus = Math.max(p.sus, 2);
      if (r.inj) p.inj = Math.max(p.inj, r.inj);
      p.morale = clamp(p.morale + (r.rating >= 7.5 ? 3 : r.rating < 5.8 ? -2 : 0.5), 5, 100);
    }
    for (const [tid, gf, ga] of [[fxm.h, res.hs, res.as], [fxm.a, res.as, res.hs]]) {
      const t = team(G, tid);
      const won = gf > ga || (res.pens && (tid === fxm.h ? res.pens[0] > res.pens[1] : res.pens[1] > res.pens[0]));
      const r = gf > ga ? 'W' : gf < ga ? 'L' : 'D';
      t.form.push(r); if (t.form.length > 6) t.form.shift();
      for (const id of t.squad) {
        const p = G.players[id];
        if (!played.has(id)) {
          if (p.ovr >= W.squadOvr(G, t) && p.inj <= 0) p.morale = clamp(p.morale - 1.5, 5, 100);
        }
        p.morale = clamp(p.morale + (r === 'W' ? 2.5 : r === 'L' ? -2.5 : 0), 5, 100);
      }
      t.fans = clamp(t.fans + (r === 'W' ? 1.2 : r === 'L' ? -1.2 : 0), 10, 100);
    }
  }

  // ── 한 주 진행 ─────────────────────────────────────────────
  // userMatch: 사용자 경기를 엔진으로 치렀을 때의 Match 객체 (없으면 빠른 시뮬)
  function playWeek(G, userMatch) {
    const ev = currentEvent(G);
    if (!ev) return null;
    const rng = rngOf(G);
    const uid = G.user.teamId;
    const summary = { ev, results: [], user: null };
    // 출전 정지 소진은 이번 주 경기 전에 판정된 상태로 처리
    const teamsPlaying = new Set();
    let fixtures;
    if (ev.k === 'L') fixtures = G.fixtures[0][ev.r].map((m) => ({ m, div: 0 })).concat(G.fixtures[1][ev.r].map((m) => ({ m, div: 1 })));
    else fixtures = G.cup.rounds[ev.r].map((m) => ({ m, div: -1 }));
    for (const { m, div } of fixtures) {
      teamsPlaying.add(m.h); teamsPlaying.add(m.a);
      const isUser = m.h === uid || m.a === uid;
      let res;
      if (isUser && userMatch) {
        res = engineResult(G, userMatch);
        if (ev.k === 'C' && res.hs === res.as) res.pens = shootout(rng);
      } else {
        res = quickSim(G, team(G, m.h), team(G, m.a), rng, ev.k === 'C');
      }
      // 징계 소진: 경기에 나서지 못한 징계 선수
      for (const tid of [m.h, m.a]) for (const id of team(G, tid).squad) { const p = G.players[id]; if (p.sus > 0 && !res.players.some((r) => r.p === p)) p.sus--; }
      applyResult(G, m, res, ev.k);
      if (ev.k === 'C') m.w = res.hs > res.as ? m.h : res.hs < res.as ? m.a : (res.pens[0] > res.pens[1] ? m.h : m.a);
      const item = { m, div, res };
      summary.results.push(item);
      if (isUser) summary.user = item;
      // 홈 경기 수입
      gateIncome(G, team(G, m.h), ev.k === 'C', rng);
    }
    if (ev.k === 'C') advanceCup(G, ev.r);
    if (summary.user) afterUserMatch(G, summary.user, ev, rng);
    weekly(G, rng, teamsPlaying);
    G.week++;
    saveRng(G, rng);
    if (G.week >= G.calendar.length) summary.seasonOver = true;
    return summary;
  }

  function advanceCup(G, r) {
    const winners = G.cup.rounds[r].map((m) => m.w);
    if (winners.length === 1) {
      G.cup.winner = winners[0];
      const t = team(G, winners[0]);
      news(G, 'cup', `${t.name}, 코리아 컵 우승!`, `${josa(t.name, '이/가')} 결승에서 승리하며 컵을 들어 올렸습니다.`);
      if (t.id === G.user.teamId) { G.user.trophies.push({ year: G.year, name: '코리아 컵' }); unlock(G, 'cup'); G.board.conf = clamp(G.board.conf + 15, 0, 100); }
      return;
    }
    G.cup.rounds.push(pairUp(winners));
  }

  function afterUserMatch(G, item, ev, rng) {
    const uid = G.user.teamId;
    const { m, res } = item;
    const home = m.h === uid;
    const gf = home ? res.hs : res.as, ga = home ? res.as : res.hs;
    const opp = team(G, home ? m.a : m.h);
    let r = gf > ga ? 'W' : gf < ga ? 'L' : 'D';
    if (r === 'W') G.user.wins++; else if (r === 'L') G.user.losses++; else G.user.draws++;
    // 구단주 신뢰도
    const exp = W.teamRating(G, userTeam(G)) - W.teamRating(G, opp);
    const delta = r === 'W' ? 2.5 - exp * 0.05 : r === 'L' ? -2.2 - exp * 0.07 : -0.2 - exp * 0.04;
    G.board.conf = clamp(G.board.conf + delta, 0, 100);
    G.unbeaten = r === 'L' ? 0 : G.unbeaten + 1;
    if (r === 'W') unlock(G, 'firstWin');
    if (G.unbeaten >= 10) unlock(G, 'unbeaten10');
    if (gf - ga >= 4) unlock(G, 'thrash');
    if (r === 'W' && W.squadOvr(G, opp) - W.squadOvr(G, userTeam(G)) >= 5) unlock(G, 'giant');
    const scorers = res.players.filter((x) => x.goals > 0 && x.p.teamId === uid).map((x) => x.p.name + (x.goals > 1 ? ` ${x.goals}골` : '')).join(', ');
    const label = ev.k === 'L' ? `리그 ${ev.r + 1}R` : `컵 ${CUP_NAMES[ev.r]}`;
    const word = r === 'W' ? '승리' : r === 'L' ? '패배' : '무승부';
    news(G, 'match', `[${label}] ${opp.name}전 ${gf}-${ga} ${word}`, scorers ? `득점: ${scorers}` : '득점 없이 경기를 마쳤습니다.');
    const best = res.players.slice().sort((a, b) => b.rating - a.rating)[0];
    G.lastMatch = { opp: opp.id, home, gf, ga, r, label, motm: best ? best.p.id : null, pens: res.pens };
    for (const x of res.players) {
      if (x.inj && x.p.teamId === uid) news(G, 'injury', `${x.p.name} 부상`, `${josa(x.p.name, '이/가')} 부상으로 약 ${x.inj}주간 결장합니다.`);
    }
  }

  function gateIncome(G, t, cup, rng) {
    const fill = clamp(0.45 + t.fans / 200 + (t.form.filter((f) => f === 'W').length - 2) * 0.03 + rng.gauss(0, 0.04), 0.3, 1);
    const cap = Math.round(t.cap * (1 + (t.facilities.stadium - 1) * 0.15));
    const att = Math.round(cap * fill);
    const ticket = t.div === 1 ? 0.65 : 0.45; // 만 원 (구단 몫)
    const inc = Math.round(att * ticket * (cup ? 1.2 : 1));
    t.balance += inc;
    if (t.id === G.user.teamId) { addFin(G, '입장 수입', inc); G.lastAttendance = att; }
  }

  const CAT = { '입장 수입': '입장 수입', '중계권·스폰서': '중계권·스폰서', '상품 판매': '상품 판매', '선수 주급': '선수 주급', '리그 상금': '상금' };
  function addFin(G, label, amount) {
    G.fin.log.unshift({ w: G.week, s: G.season, label, amount });
    if (G.fin.log.length > 60) G.fin.log.pop();
    const cat = CAT[label] || (amount >= 0 ? '이적 수입' : / 공사$/.test(label) ? '시설 투자' : / 영입$/.test(label) ? '이적 지출' : '기타 지출');
    G.fin.cat[cat] = (G.fin.cat[cat] || 0) + amount;
    if (amount >= 0) G.fin.seasonIncome += amount; else G.fin.seasonSpend -= amount;
  }

  // 주간 처리: 회복, 훈련, 재정, 이적
  function weekly(G, rng, teamsPlaying) {
    const uid = G.user.teamId;
    for (const t of G.teams) {
      const isUser = t.id === uid;
      const intensity = isUser ? G.training.intensity : 1;
      const focus = isUser ? G.training.focus : 'bal';
      for (const id of t.squad) {
        const p = G.players[id];
        if (p.inj > 0) p.inj--;
        const rec = [26, 19, 13][intensity] + p.attr.phy / 20;
        p.cond = Math.round(clamp(p.cond + rec, 0, 100));
        // 훈련 부상
        if (intensity === 2 && rng.chance(0.004)) { p.inj = rng.int(1, 3); if (isUser) news(G, 'injury', `${p.name} 훈련 중 부상`, `강도 높은 훈련 도중 부상을 입어 ${p.inj}주 결장합니다.`); }
        develop(G, p, t, rng, intensity, focus);
        p.morale = clamp(p.morale + (70 - p.morale) * 0.04, 5, 100);
      }
      // 재정: 주급, 중계권/스폰서
      const wages = W.wageBill(G, t);
      const tv = t.div === 1 ? 3000 + t.rep * 30 : 1200 + t.rep * 12;
      const merch = Math.round(t.fans * (t.div === 1 ? 20 : 8));
      t.balance += tv + merch - wages;
      if (isUser) { addFin(G, '중계권·스폰서', tv); addFin(G, '상품 판매', merch); addFin(G, '선수 주급', -wages); }
      if (!isUser) W.validateLineup(G, t);
    }
    // 시설 공사 진행
    const ut = userTeam(G);
    if (ut.build) {
      ut.build.weeks--;
      if (ut.build.weeks <= 0) {
        ut.facilities[ut.build.k]++;
        news(G, 'club', `${FAC[ut.build.k].name} 공사 완료`, `${josa(FAC[ut.build.k].name, '이/가')} ${ut.facilities[ut.build.k]}단계로 업그레이드되었습니다.`);
        ut.build = null;
      }
    }
    if (windowOpen(G)) { aiTransfers(G, rng); incomingOffers(G, rng); }
    // 만료된 제안 정리
    G.offers = G.offers.filter((o) => o.exp > G.week);
    if (G.board.conf < 10 && G.week > 10 && position(G, G.user.teamId) > G.board.goal.pos + 2) G.user.sacked = true;
  }

  // 선수 성장/노화
  function develop(G, p, t, rng, intensity, focus) {
    const fac = 1 + (t.facilities.train - 1) * 0.12;
    const intF = [0.6, 1, 1.4][intensity];
    const playF = 0.75 + Math.min(1, p.season.apps / Math.max(1, G.week * 0.7)) * 0.5;
    let pts = 0;
    if (p.age <= 29 && p.ovr < p.pot) {
      const gap = p.pot - p.ovr;
      const ageF = p.age <= 20 ? 1.3 : p.age <= 23 ? 1 : p.age <= 26 ? 0.6 : 0.3;
      pts = gap * 0.018 * ageF * fac * intF * playF;
    }
    if (p.age >= 31) pts -= (p.age - 29) * 0.012 * (intensity === 2 ? 1.2 : 1);
    p._dev = (p._dev || 0) + pts * 3.2;
    while (p._dev >= 1 || p._dev <= -1) {
      const sign = p._dev > 0 ? 1 : -1;
      p._dev -= sign;
      const k = pickAttr(p, focus, rng, sign < 0);
      p.attr[k] = clamp(p.attr[k] + sign, 10, 99);
    }
    W.refreshPlayer(p);
  }
  const FOCUS = {
    bal: null,
    atk: ['sho', 'dri', 'pac'],
    def: ['def', 'phy'],
    tec: ['pas', 'dri'],
    phy: ['pac', 'phy'],
  };
  function pickAttr(p, focus, rng, decline) {
    if (decline) return rng.pick(['pac', 'pac', 'phy', 'dri', p.pos === 'GK' ? 'gk' : 'def']);
    if (p.pos === 'GK') return rng.chance(0.75) ? 'gk' : rng.pick(['pas', 'phy']);
    const pool = FOCUS[focus];
    if (pool && rng.chance(0.65)) return rng.pick(pool);
    const w = { DF: ['def', 'def', 'phy', 'pac', 'pas'], MF: ['pas', 'pas', 'dri', 'def', 'sho', 'phy'], FW: ['sho', 'sho', 'dri', 'pac', 'phy'] }[p.pos];
    return rng.pick(w);
  }

  // ── 이적 ───────────────────────────────────────────────────
  function aiTransfers(G, rng) {
    const n = rng.int(1, 3);
    for (let i = 0; i < n; i++) {
      const buyer = rng.pick(G.teams.filter((t) => t.id !== G.user.teamId && t.squad.length < 28));
      if (!buyer) return;
      const pos = rng.pick(['GK', 'DF', 'MF', 'FW']);
      const mine = buyer.squad.map((id) => G.players[id]).filter((p) => p.pos === pos).sort((a, b) => b.ovr - a.ovr);
      const need = mine[pos === 'GK' ? 0 : 2] ? mine[pos === 'GK' ? 0 : 2].ovr : 55;
      const cands = Object.values(G.players).filter((p) => p.teamId != null && p.teamId !== buyer.id && p.teamId !== G.user.teamId && p.pos === pos && p.ovr > need + 1 && p.value < buyer.balance * 0.6);
      if (!cands.length) continue;
      const p = rng.pick(cands.slice(0, 40));
      const seller = team(G, p.teamId);
      if (seller.squad.length <= 20) continue;
      const fee = Math.round(p.value * rng.range(0.95, 1.3) / 100) * 100;
      movePlayer(G, p, seller, buyer, fee);
      news(G, 'transfer', `${p.name}, ${buyer.name} 이적`, `${seller.name}에서 ${josa(buyer.name, '으로/로')} 이적 (이적료 ${money(fee)})`);
    }
  }

  function movePlayer(G, p, from, to, fee) {
    if (from) {
      from.squad = from.squad.filter((id) => id !== p.id);
      from.lineup = from.lineup.map((id) => (id === p.id ? null : id));
      from.bench = from.bench.filter((id) => id !== p.id);
      from.balance += fee;
    } else {
      G.freeAgents = G.freeAgents.filter((id) => id !== p.id);
    }
    if (to) {
      to.squad.push(p.id);
      to.balance -= fee;
      p.teamId = to.id;
      p.num = 0;
      W.assignNumbers(G, to);
    } else {
      p.teamId = null;
      G.freeAgents.push(p.id);
    }
    p.listed = false;
    p.morale = clamp(p.morale + 8, 5, 100);
    G.transfers.unshift({ s: G.season, w: G.week, pid: p.id, from: from ? from.id : null, to: to ? to.id : null, fee });
    if (G.transfers.length > 80) G.transfers.pop();
    if (from) W.validateLineup(G, from);
    if (to) W.validateLineup(G, to);
  }

  // 사용자 선수에 대한 영입 제의
  function incomingOffers(G, rng) {
    const ut = userTeam(G);
    for (const id of ut.squad) {
      const p = G.players[id];
      const pr = p.listed ? 0.35 : 0.025 * (p.ovr > 72 ? 2 : 1);
      if (!rng.chance(pr)) continue;
      if (G.offers.some((o) => o.pid === id)) continue;
      const buyers = G.teams.filter((t) => t.id !== ut.id && t.balance > p.value * 0.8);
      if (!buyers.length) continue;
      const b = rng.pick(buyers);
      const amount = Math.round(p.value * (p.listed ? rng.range(0.75, 1.05) : rng.range(0.95, 1.35)) / 100) * 100;
      G.offers.push({ id: G.season * 1000 + G.week * 10 + G.offers.length, pid: id, from: b.id, amount, exp: G.week + 2 });
      news(G, 'offer', `${b.name}, ${p.name} 영입 제안`, `${josa(b.name, '이/가')} ${p.name}에게 ${money(amount)}를 제시했습니다. 이적 탭에서 응답하세요.`);
    }
  }

  function acceptOffer(G, offerId) {
    const o = G.offers.find((x) => x.id === offerId);
    if (!o) return { ok: false, msg: '제안이 만료되었습니다.' };
    const p = G.players[o.pid];
    const ut = userTeam(G);
    if (ut.squad.length <= 18) return { ok: false, msg: '선수단이 18명 이하라 더 팔 수 없어요.' };
    const buyer = team(G, o.from);
    movePlayer(G, p, ut, buyer, o.amount);
    addFin(G, `${p.name} 이적료`, o.amount);
    G.offers = G.offers.filter((x) => x.id !== offerId && x.pid !== o.pid);
    news(G, 'transfer', `${p.name}, ${buyer.name}로 떠나다`, `이적료 ${money(o.amount)}에 합의했습니다.`);

  // 영입 협상: 구단 간 이적료
  function askingPrice(G, p) {

    const starter = t.lineup.includes(p.id);
    const f = (p.listed ? 0.9 : 1.15) + (starter ? 0.25 : 0) + (t.squad.length <= 20 ? 0.3 : 0);
    return Math.round(p.value * f / 100) * 100;
  }
  function wageDemand(G, p, toTeam) {
    const repGap = (p.teamId != null ? team(G, p.teamId).rep : 55) - toTeam.rep;
    const f = 1.1 + Math.max(0, repGap) * 0.03 + (p.teamId == null ? -0.05 : 0);

  function willingToJoin(G, p, toTeam) {

  function makeBid(G, pid, amount) {
    const p = G.players[pid];
    const ut = userTeam(G);
    if (!windowOpen(G) && p.teamId != null) return { status: 'closed', msg: '이적시장이 닫혀 있어요. 자유계약 선수만 영입할 수 있어요.' };
    if (amount > ut.balance) return { status: 'money', msg: '구단 잔고가 부족해요.' };
    if (ut.squad.length >= 30) return { status: 'full', msg: '선수단이 30명으로 가득 찼어요. 먼저 정리하세요.' };
    if (!willingToJoin(G, p, ut)) return { status: 'refuse', msg: `${josa(p.name, '은/는')} 우리 구단 이적에 관심이 없어요.` };

    if (amount >= ask) return { status: 'accept', fee: amount, wage: wageDemand(G, p, ut), msg: '이적료 합의! 이제 선수와 연봉 협상을 하세요.' };

  function completeSigning(G, pid, fee, wage, years) {

    const from = p.teamId != null ? team(G, p.teamId) : null;

    p.wage = wage; p.contract = years;

  function releasePlayer(G, pid) {
    const p = G.players[pid];

    const comp = Math.round(p.wage * 16 * Math.max(1, p.contract) / 5) * 5;

  }

  function renewDemand(G, p) {
    const base = W.wageOf(p);
    const moraleF = p.morale < 40 ? 1.35 : p.morale < 60 ? 1.15 : 1;
    return Math.round(Math.max(p.wage, base) * moraleF * 1.05 / 5) * 5;

    p.wage = renewDemand(G, p);
    p.contract = years;

  const FAC = {

    youth: { name: '유스 아카데미', desc: '유스 유망주 잠재력 상승' },
    stadium: { name: '경기장', desc: '수용 인원 +15%/단계' },

  function upgradeFacility(G, k) {
    const t = userTeam(G);

    if (t.facilities[k] >= 5) return { ok: false, msg: '최고 단계예요.' };

    if (cost > t.balance) return { ok: false, msg: '잔고가 부족해요.' };
